<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo-selectaescritura-black.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbf9" />
    <meta name="description" content="Selecta Escritura – Escuela de escritura online y en Valencia." />
    <title>Selecta Escritura | Escuela de escritura en Valencia</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Copia estática del formulario de contacto para que Netlify Forms lo detecte al desplegar.
         Los campos deben coincidir con src/components/page/ContactForm.jsx -->
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="nombre" /><input name="apellidos" /><input type="email" name="email" />
      <input type="tel" name="telefono" /><textarea name="mensaje"></textarea>
      <input type="checkbox" name="privacidad" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
